name: Godot 4.7.2 · Aurora M8–M10 Validation
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Aurora
        uses: actions/checkout@v4
      - name: Instalar Godot 4.7.2 oficial
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Importar projeto e analisar scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          if grep -q "Vector3 cannot be normalized" godot-import.log; then
            echo "Falha: normais inválidas nos modelos 3D importados."
            exit 1
          fi
      - name: Testar o mundo 3D, câmara e HUD
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/smoke.gd 2>&1 | tee godot-smoke.log
          grep -q "M0_SMOKE_OK" godot-smoke.log
      - name: Testar o primeiro colono, guerreiro, cidade e turnos
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/game_smoke.gd 2>&1 | tee godot-m1.log
          grep -q "M1_SMOKE_OK" godot-m1.log
      - name: Testar cidades, produção e distritos 3D
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/city_smoke.gd 2>&1 | tee godot-m2.log
          grep -q "M2_SMOKE_OK" godot-m2.log
      - name: Testar navegação, exploração, combate e gravação M3
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/military_smoke.gd 2>&1 | tee godot-m3.log
          grep -q "M3_SMOKE_OK" godot-m3.log
      - name: Validar a nova arte 3D e as animações M3.5
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/art_smoke.gd 2>&1 | tee godot-m35.log
          grep -q "M35_SMOKE_OK" godot-m35.log
      - name: Importar modelos GLB e validar animações M4
        shell: bash
        run: |
          set -o pipefail
          timeout 70s godot --headless --path . --script res://tests/glb_import_smoke.gd 2>&1 | tee godot-m4-glb.log
          grep -q "M4_GLB_OK" godot-m4-glb.log
      - name: M5 - Validar efeitos 3D de combate
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/combat_fx_smoke.gd 2>&1 | tee godot-m5.log
          grep -q "M5_SMOKE_OK" godot-m5.log
      - name: M6 - Validar costas e estaleiros por turnos
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/coast_construction_smoke.gd 2>&1 | tee godot-m6.log
          grep -q "M6_SMOKE_OK" godot-m6.log
      - name: M7 - Validar investigação, economia e persistência
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/technology_smoke.gd 2>&1 | tee godot-m7.log
          grep -q "M7_SMOKE_OK" godot-m7.log
      - name: M8 - Cultura, governos e gravação
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/civics_smoke.gd 2>&1 | tee godot-m8.log
          grep -q "M8_SMOKE_OK" godot-m8.log
      - name: M9 - Diplomacia, paz e comércio
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/diplomacy_smoke.gd 2>&1 | tee godot-m9.log
          grep -q "M9_SMOKE_OK" godot-m9.log
      - name: M10 - Quatro vitórias e IA com projetos
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/victory_smoke.gd 2>&1 | tee godot-m10.log
          grep -q "M10_SMOKE_OK" godot-m10.log
      - name: Captura real com Godot e X virtual
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --script res://tests/visual_capture.gd 2>&1 | tee godot-visual.log
          grep -q "M7_VISUAL_OK" godot-visual.log
          test -s visual-m7-mundo.png
      - name: Criar galeria de oito prints reais do jogo
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --script res://tests/gallery_capture.gd 2>&1 | tee godot-galeria.log
          grep -q "GALERIA_COMPLETA_OK" godot-galeria.log
          test "$(find . -maxdepth 1 -name 'galeria_*.png' | wc -l)" -eq 8
      - name: Fotografar cultura, diplomacia e condições de vitória
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --script res://tests/strategic_capture.gd 2>&1 | tee godot-m8-m10-visual.log
          grep -q "M8_M10_VISUAL_OK" godot-m8-m10-visual.log
          test "$(find . -maxdepth 1 -name 'aurora_m*.png' | wc -l)" -eq 5
      - name: Guardar logs para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-m8-m10-validacao
          path: |
            godot-import.log
            godot-smoke.log
            godot-m1.log
            godot-m2.log
            godot-m3.log
            godot-m35.log
            godot-m4-glb.log
            godot-m5.log
            godot-m6.log
            godot-m7.log
            godot-m8.log
            godot-m9.log
            godot-m10.log
            godot-m8-m10-visual.log
            aurora_m*.png
            godot-galeria.log
            galeria_*.png
            visual-m7-tecnologias.png
            godot-visual.log
            visual-m7-mundo.png
          if-no-files-found: ignore
